<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Schibsted+Grotesk:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF8;--panel:#FFFFFF;--panel2:#F1F1EE;--ink:#17171B;--mut:#6E6E76;--line:#E6E6E1;--grid:rgba(20,20,30,.03);--accent:#17171B;--accent2:#4A4A52;--accent-soft:rgba(23,23,27,.06);--grad:#17171B;--grad-ink:#FFFFFF;--selbg:rgba(23,23,27,.16);--ok:#1F9D63;--bad:#D2453B;--shadow:0 1px 2px rgba(20,20,30,.05),0 14px 34px -14px rgba(20,20,30,.14);}
[data-palette="warm"]{--accent:#F72585;--accent2:#FF8E3C;--accent-soft:rgba(247,37,133,.08);--grad:linear-gradient(135deg,var(--accent),var(--accent2));--grad-ink:#fff;--selbg:rgba(247,37,133,.25);}
[data-paper="cream"]{--bg:#FAF9F6;--panel2:#F3F1EC;--line:#E8E5DE;--grid:rgba(20,20,25,.04);}
[data-paper="blush"]{--bg:#FBF4F6;--panel2:#F6ECEF;--line:#EBDEE3;--grid:rgba(180,40,100,.045);}
[data-theme="dark"]{--bg:#131316;--panel:#1B1B1F;--panel2:#242429;--ink:#EFEEEA;--mut:#9A9AA3;--line:#2B2B31;--grid:rgba(255,255,255,.035);--accent:#EFEEEA;--accent2:#B9B9C0;--accent-soft:rgba(255,255,255,.08);--grad:#EFEEEA;--grad-ink:#151519;--selbg:rgba(255,255,255,.22);--ok:#3DD68C;--bad:#FF6B70;--shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -18px rgba(0,0,0,.6);}
[data-theme="dark"][data-palette="warm"]{--accent:#FF4FA3;--accent2:#FFA05C;--accent-soft:rgba(255,79,163,.13);--grad:linear-gradient(135deg,var(--accent),var(--accent2));--grad-ink:#fff;--selbg:rgba(255,79,163,.3);}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',sans-serif;}
*{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent2)}
button{font-family:inherit}input,textarea{font-family:inherit;color:inherit}
input::placeholder{color:var(--mut)}
::selection{background:var(--selbg)}
[data-motion="off"] *{animation:none!important;transition:none!important}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(5px)}to{opacity:1;transform:none}}
@keyframes blinkDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@media (max-width:980px){[data-pagepad]{padding:22px 18px 90px!important}[data-hide-sm]{display:none!important}}
@media (pointer:coarse){[data-hit]{min-height:44px!important;min-width:44px!important}input{font-size:16px!important}}
</style>
</helmet>

<div data-screen-label="Quick answer" style="display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;">
  <div style="display:flex;flex:1;min-height:0;">
  <nav style="width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line);background:var(--panel);z-index:30;">
    <div style="width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;margin-bottom:10px;box-shadow:var(--shadow);color:var(--grad-ink);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.4 6.1 6.1 2.4-6.1 2.4L12 19.5 9.6 13.4 3.5 11l6.1-2.4z"></path></svg>
    </div>
    <a href="./Home.dc.html" title="Home" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:transparent;color:var(--mut);" style-hover="background:var(--panel2);color:var(--mut)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="./Note.dc.html" title="Notes" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:transparent;color:var(--mut);" style-hover="background:var(--panel2);color:var(--mut)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="./Reviews.dc.html" title="Reviews" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:transparent;color:var(--mut);position:relative;transition:background .15s;" style-hover="background:var(--panel2);color:var(--mut)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--streak,#EA580C);border:2px solid var(--panel);"></span></a>
    <a href="./Pricing.dc.html" title="Upgrade to Pro" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:transparent;color:var(--mut);" style-hover="background:var(--panel2);color:var(--mut)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"></path></svg></a>
    <div style="flex:1"></div>
    <button onClick="{{ toggleTheme }}" title="Theme" style="width:42px;height:42px;border-radius:12px;border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;background:var(--panel2);color:var(--ink);" style-hover="border-color:var(--accent)">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"></path></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.4 13.6A8.5 8.5 0 1 1 10.4 3.6a6.8 6.8 0 0 0 10 10z"></path></svg></sc-if>
    </button>
    <div style="width:36px;height:36px;border-radius:50%;background:#3D4757;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:6px;">T</div>
  </nav>

  <main style="flex:1;min-width:0;overflow-y:auto;position:relative;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;">
      <div data-pagepad="1" style="max-width:780px;margin:0 auto;padding:30px 40px 40px;display:flex;flex-direction:column;min-height:100%;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;">
          <a href="./Home.dc.html" title="Back" data-hit="1" style="width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;" style-hover="border-color:var(--ink);color:var(--ink)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
          <h1 style="margin:0;font-family:'Schibsted Grotesk',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em;">Quick answer</h1>
          <span style="font-size:11.5px;font-weight:600;color:var(--mut);border:1px dashed var(--line);border-radius:999px;padding:4px 10px;">not saved</span>
          <div style="flex:1"></div>
          <button onClick="{{ askAnother }}" style="height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;" style-hover="border-color:var(--ink)">New question</button>
          <a href="./Note.dc.html?processing=1" style="height:34px;padding:0 15px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s;" style-hover="opacity:.87;color:var(--bg)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5"></path></svg>Save as note</a>
        </div>
        <p style="margin:0 0 18px;font-size:12.5px;color:var(--mut);">A lightweight chat — nothing is stored unless you save it as a note.</p>
        <div style="flex:1;display:flex;flex-direction:column;gap:14px;">
          <sc-for list="{{ askMsgs }}" as="m" hint-placeholder-count="1">
            <div style="display:flex;flex-direction:column;align-items:{{ m.align }};animation:popIn .2s ease both;">
              <div style="max-width:82%;font-size:14.5px;line-height:1.6;padding:12px 16px;border-radius:{{ m.radius }};background:{{ m.bg }};color:{{ m.color }};">{{ m.text }}</div>
            </div>
          </sc-for>
          <sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
            <div style="display:inline-flex;gap:4px;padding:13px 15px;background:var(--panel2);border-radius:13px 13px 13px 4px;width:max-content;">
              <span style="width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blinkDot 1.2s infinite;"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blinkDot 1.2s .2s infinite;"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blinkDot 1.2s .4s infinite;"></span>
            </div>
          </sc-if>
        </div>
        <div style="position:sticky;bottom:18px;margin-top:20px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;">
            <sc-for list="{{ askChips }}" as="c" hint-placeholder-count="3">
              <button onClick="{{ c.onSend }}" style="border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;" style-hover="border-color:var(--ink);background:var(--accent-soft)">{{ c.t }}</button>
            </sc-for>
          </div>
          <div style="display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:15px;padding:6px 6px 6px 16px;background:var(--panel);box-shadow:var(--shadow);">
            <input value="{{ askInput }}" onChange="{{ onAskInput }}" onKeyDown="{{ onAskKey }}" placeholder="Ask a follow-up…" style="flex:1;border:none;outline:none;background:transparent;font-size:14.5px;min-width:0;">
            <button onClick="{{ sendAskNow }}" data-hit="1" style="width:38px;height:38px;border-radius:11px;border:none;cursor:pointer;background:var(--grad);color:var(--grad-ink);display:grid;place-items:center;flex:0 0 38px;transition:transform .15s;" style-hover="transform:scale(1.06)" style-active="transform:scale(.95)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 20 4l-4.5 16-4-6.5z"></path><path d="M20 4l-8.5 9.5"></path></svg></button>
          </div>
        </div>
      </div>
  </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;graphite&quot;,&quot;warm&quot;],&quot;default&quot;:&quot;graphite&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:[&quot;#F72585&quot;,&quot;#FF8E3C&quot;],&quot;options&quot;:[[&quot;#F72585&quot;,&quot;#FF8E3C&quot;],[&quot;#7C3AED&quot;,&quot;#22D3EE&quot;],[&quot;#0E9F6E&quot;,&quot;#84CC16&quot;],[&quot;#C96F45&quot;,&quot;#E8A87C&quot;]],&quot;tsType&quot;:&quot;string | string[]&quot;,&quot;section&quot;:&quot;Brand (warm palette only)&quot;},&quot;paper&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;cream&quot;,&quot;blush&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Comfort&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      theme: localStorage.getItem('lapp-theme') || 'light',
      askMsgs: [], askInput: '', typing: false,
    };
  }
  componentDidMount() {
    this.applyPrefs();
    const q = new URLSearchParams(location.search).get('q');
    if (q) this.sendAsk(q);
  }
  componentDidUpdate() { this.applyPrefs(); }
  componentWillUnmount() { clearTimeout(this._rt); }
  applyPrefs() {
    const el = document.documentElement;
    el.setAttribute('data-theme', this.state.theme);
    el.setAttribute('data-motion', (this.props.reduceMotion ?? false) ? 'off' : 'on');
    el.setAttribute('data-paper', this.props.paper ?? 'neutral');
    const palette = this.props.palette ?? 'graphite';
    el.setAttribute('data-palette', palette);
    const a = this.props.accent;
    const pair = Array.isArray(a) ? a : (a ? [a, a] : null);
    if (palette === 'warm' && pair) {
      el.style.setProperty('--accent', pair[0]); el.style.setProperty('--accent2', pair[1] || pair[0]);
    } else { el.style.removeProperty('--accent'); el.style.removeProperty('--accent2'); }
  }
  sendAsk(text) {
    if (!text) return;
    this.setState(st => ({ askMsgs: [...st.askMsgs, { id: Date.now(), role: 'user', kind: 'text', text }], askInput: '', typing: true }));
    this._rt = setTimeout(() => {
      const reply = /нефть|food|1996/i.test(text)
        ? 'Программа «Нефть в обмен на продовольствие» появилась в 1996 году (резолюция ООН №986): Ираку разрешили продавать нефть под контролем ООН, а выручка шла на еду и лекарства. Если пригодится — нажми «Save as note», и я оформлю это в полноценную заметку с квизом.'
        : 'Коротко: официальным поводом было ОМП, которое так и не нашли. Реальная картина сложнее — санкции 90-х, шаткость режима после 1991-го и ставка на «смену режима». Хочешь, разберу по шагам — или сохрани это как заметку, и я сделаю из ответа конспект с квизом.';
      this.setState(st => ({ typing: false, askMsgs: [...st.askMsgs, { id: Date.now() + 1, role: 'ai', kind: 'text', text: reply }] }));
    }, 1200);
  }
  renderVals() {
    const s = this.state;
    return {
      isDark: s.theme === 'dark', isLight: s.theme === 'light',
      toggleTheme: () => { const t = s.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('lapp-theme', t); this.setState({ theme: t }); },
      askMsgs: s.askMsgs.map(m => {
        const user = m.role === 'user';
        return { ...m, align: user ? 'flex-end' : 'flex-start', bg: user ? 'var(--grad)' : 'var(--panel2)', color: user ? 'var(--grad-ink)' : 'var(--ink)', radius: user ? '13px 13px 4px 13px' : '13px 13px 13px 4px' };
      }),
      typing: s.typing,
      askInput: s.askInput, onAskInput: (e) => this.setState({ askInput: e.target.value }),
      onAskKey: (e) => { if (e.key === 'Enter') this.sendAsk(s.askInput); },
      sendAskNow: () => this.sendAsk(s.askInput),
      askChips: ['Объясни проще', 'Дай пример', 'А что случилось после?'].map(t => ({ t, onSend: () => this.sendAsk(t) })),
      askAnother: () => this.setState({ askMsgs: [], askInput: '' }),
    };
  }
}
</script>
</body>
</html>
