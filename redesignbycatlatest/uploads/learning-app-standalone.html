document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

hadow }};transition:transform .15s;\" style-hover=\"transform:translateY(-1px)\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M21 12a8 8 0 0 1-8 8H4.5l2-2.6A8 8 0 1 1 21 12z\"><\u002Fpath><\u002Fsvg>Chat<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- content + chat grid -->\n          <div data-notegrid=\"1\" style=\"display:grid;grid-template-columns:{{ gridCols }};gap:18px;align-items:start;transition:grid-template-columns .25s;\">\n            <!-- content -->\n            <div ref=\"{{ setContentEl }}\" style=\"position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:34px 40px 44px;min-width:0;\">\n\n              <!-- selection popover -->\n              <sc-if value=\"{{ hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n                <div data-selpop=\"1\" style=\"position:absolute;z-index:50;left:{{ selLeft }}px;top:{{ selTop }}px;transform:translateX(-50%);display:flex;align-items:center;background:var(--ink);color:var(--bg);border-radius:13px;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);padding:5px;gap:2px;animation:popIn .15s ease both;\">\n                  <button sc-camel-on-click=\"{{ askSelection }}\" style=\"border:none;background:transparent;color:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;\" style-hover=\"background:rgba(255,255,255,.14)\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2.5l2.4 6.1 6.1 2.4-6.1 2.4L12 19.5 9.6 13.4 3.5 11l6.1-2.4z\"><\u002Fpath><\u002Fsvg>Ask<\u002Fbutton>\n                  <span style=\"width:1px;height:16px;background:rgba(255,255,255,.2);\"><\u002Fspan>\n                  <button sc-camel-on-click=\"{{ quizSelection }}\" style=\"border:none;background:transparent;color:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;\" style-hover=\"background:rgba(255,255,255,.14)\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.4-3 4.4\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9.2\"><\u002Fcircle><\u002Fsvg>Make quiz<\u002Fbutton>\n                  <span style=\"width:1px;height:16px;background:rgba(255,255,255,.2);\"><\u002Fspan>\n                  <button sc-camel-on-click=\"{{ scheduleSelection }}\" style=\"border:none;background:transparent;color:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;\" style-hover=\"background:rgba(255,255,255,.14)\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 7.5V12l3 2\"><\u002Fpath><\u002Fsvg>Schedule quiz<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ tabOverview }}\" hint-placeholder-val=\"{{ true }}\">\n                <article data-screen-label=\"Overview\" style=\"max-width:760px;font-size:15px;animation:fadeUp .3s ease both;\">\n                  <p style=\"margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);\">TL;DR<\u002Fp>\n                  <p style=\"margin:0 0 22px;font-size:16.5px;line-height:1.6;font-family:'Schibsted Grotesk',sans-serif;font-weight:500;\">Вторжение США в Ирак в 2003 году, официально провозглашённое как борьба против оружия массового поражения, обернулось многолетним конфликтом, дестабилизацией региона и глубокими изменениями во внешней политике США.<\u002Fp>\n                  <h3 style=\"margin:0 0 10px;font-family:'Schibsted Grotesk',sans-serif;font-size:16px;font-weight:700;\">Основные события и факторы<\u002Fh3>\n                  <p style=\"margin:0 0 14px;color:var(--ink);\"><strong>Предыстория и санкции.<\u002Fstrong> После войны в Персидском заливе (1991) Ирак столкнулся с тяжелейшими санкциями, которые привели к гуманитарному кризису, не сумев при этом устранить режим Саддама Хусейна.<\u002Fp>\n                  <p style=\"margin:0 0 14px;\"><strong>Информационная кампания.<\u002Fstrong> Администрация Буша, поддержанная Тони Блэром, использовала угрозу ОМП как главный повод для войны — несмотря на отсутствие доказательств.<\u002Fp>\n                  <p style=\"margin:0 0 22px;\"><strong>Военная операция.<\u002Fstrong> В марте 2003 года началась операция «Свобода Ираку». Быстрая победа сменилась затяжной партизанской войной из-за ошибок оккупационной администрации.<\u002Fp>\n                  <div style=\"border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px;\">\n                    <div style=\"display:grid;grid-template-columns:150px 1fr;gap:0;\">\n                      <div style=\"padding:11px 14px;background:var(--panel2);font-weight:700;font-size:13px;border-bottom:1px solid var(--line);\">Фактор<\u002Fdiv><div style=\"padding:11px 14px;background:var(--panel2);font-weight:700;font-size:13px;border-bottom:1px solid var(--line);\">Итог<\u002Fdiv>\n                      <div style=\"padding:11px 14px;font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line);\">ОМП<\u002Fdiv><div style=\"padding:11px 14px;font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line);\">Не обнаружено — главный повод войны не подтвердился<\u002Fdiv>\n                      <div style=\"padding:11px 14px;font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line);\">Регион<\u002Fdiv><div style=\"padding:11px 14px;font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line);\">Рост влияния Ирана и радикальных группировок<\u002Fdiv>\n                      <div style=\"padding:11px 14px;font-weight:600;font-size:13.5px;\">Политика США<\u002Fdiv><div style=\"padding:11px 14px;font-size:13.5px;color:var(--mut);\">«Смена режима» стала крайне непопулярной концепцией<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <h3 style=\"margin:0 0 10px;font-family:'Schibsted Grotesk',sans-serif;font-size:16px;font-weight:700;\">Ключевые фигуры<\u002Fh3>\n                  <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n                    <span style=\"padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;\">Джордж Буш-мл.<\u002Fspan>\n                    <span style=\"padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;\">Дональд Рамсфельд<\u002Fspan>\n                    <span style=\"padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;\">Тони Блэр<\u002Fspan>\n                    <span style=\"padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;\">Саддам Хусейн<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ tabTranscript }}\" hint-placeholder-val=\"{{ false }}\">\n                <article data-screen-label=\"Transcript\" style=\"max-width:760px;font-size:15px;line-height:1.75;animation:fadeUp .3s ease both;\">\n                  <p style=\"margin:0 0 18px;\">Первого мая 2003 года Джордж Буш-младший приземлился на палубу авианосца с пафосным плакатом «миссия выполнена» и триумфально объявил:<\u002Fp>\n                  <p style=\"margin:0 0 18px;color:var(--mut);font-style:italic;\">“No terrorist network will gain weapons of mass destruction from the Iraqi regime, because the regime is no more.”<\u002Fp>\n                  <p style=\"margin:0 0 18px;\"><mark style=\"background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:1px 3px;\">Но за бурными аплодисментами никто не услышал, что в самом Ираке уже началась другая война.<\u002Fmark> Вторжение, которое должно было превратить Ирак в демократический, проамериканский оазис на Ближнем Востоке, обернулось многолетней войной, подъёмом экстремизма и изменениями всего региона и самой Америки, которые видны и сейчас, спустя больше 20 лет.<\u002Fp>\n                  <p style=\"margin:0 0 18px;\">После окончания войны в Персидском заливе, первого вторжения США в Ирак в девяносто первом году, власть Саддама оказалась шаткой. Шииты на юге и курды на севере, угнетённые его режимом, подняли восстание и попытались свергнуть диктатора. В разгар восстания Хусейн контролировал только четыре из восемнадцати провинций Ирака.<\u002Fp>\n                  <p style=\"margin:0 0 18px;\">Чтобы ослабить экономику Ирака и сделать режим Саддама слабее, ООН проголосовала за введение против страны масштабного пакета санкций, крупнейшего в истории на тот момент. В первую очередь Ираку запретили продавать нефть, лишив его главного источника денег.<\u002Fp>\n                  <p style=\"margin:0;\">В итоге страна оказалась в экономической яме, из которой не было видно выхода. Уровень жизни населения снижался вплоть до девяносто шестого года, а вместе с ним рос уровень недоедания и болезней. <mark style=\"background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:1px 3px;\">В девяносто шестом году появилась программа «Нефть в обмен на продовольствие»<\u002Fmark> — попытка смягчить гуманитарную катастрофу, сохранив давление на режим.<\u002Fp>\n                <\u002Farticle>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <!-- chat panel -->\n            <sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <aside data-screen-label=\"AI Chat\" data-chatpanel=\"1\" style=\"position:sticky;top:60px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:420px;overflow:hidden;animation:popIn .2s ease both;\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);\">\n                  <div style=\"width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;\">\n                    <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\"><path d=\"M11 21 8 8l12 5\" fill=\"#fff\"><\u002Fpath><path d=\"M37 21 40 8 28 13\" fill=\"#fff\"><\u002Fpath><circle cx=\"24\" cy=\"28\" r=\"15\" fill=\"#fff\"><\u002Fcircle><circle cx=\"18.5\" cy=\"26\" r=\"2\" fill=\"var(--accent)\"><\u002Fcircle><path d=\"M27.5 26q3 3 6 0\" stroke=\"var(--accent)\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"min-width:0;\"><strong style=\"font-size:13.5px;display:block;\">Study buddy<\u002Fstrong><span style=\"font-size:11.5px;color:var(--ok);display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--ok);\"><\u002Fspan>knows this note<\u002Fspan><\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ toggleWide }}\" title=\"{{ wideTitle }}\" style=\"margin-left:auto;width:28px;height:28px;border:none;border-radius:9px;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center;\" style-hover=\"background:var(--panel2);color:var(--ink)\">\n                    <sc-if value=\"{{ chatWide }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 15l-5.5 5.5M4 15v5.5h5.5M15 9l5.5-5.5M20 9V3.5h-5.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                    <sc-if value=\"{{ chatNarrow }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20l5.5-5.5M4 14.5V20h5.5M20 4l-5.5 5.5M14.5 4H20v5.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  <\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ toggleChat }}\" style=\"width:28px;height:28px;border:none;border-radius:9px;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center;\" style-hover=\"background:var(--panel2);color:var(--ink)\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                <\u002Fdiv>\n                <div ref=\"{{ setChatEl }}\" style=\"flex:1;overflow-y:auto;padding:16px 15px;display:flex;flex-direction:column;gap:12px;\">\n                  <sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"1\">\n                    <div style=\"display:flex;flex-direction:column;align-items:{{ m.align }};animation:popIn .2s ease both;\">\n                      <sc-if value=\"{{ m.hasQuote }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"max-width:92%;font-size:12px;color:var(--mut);background:var(--panel2);border-radius:11px 11px 4px 11px;padding:8px 11px;margin-bottom:4px;font-style:italic;\">“{{ m.quote }}”<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ m.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"max-width:92%;font-size:13.5px;line-height:1.55;padding:10px 13px;border-radius:{{ m.radius }};background:{{ m.bg }};color:{{ m.color }};border:{{ m.border }};\">{{ m.text }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ m.isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--bg);\">\n                          <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:9px;\"><span style=\"font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;\">QUICK QUIZ<\u002Fspan><span style=\"font-size:11px;color:var(--mut);\">from your selection<\u002Fspan><\u002Fdiv>\n                          <p style=\"margin:0 0 10px;font-size:13.5px;font-weight:600;line-height:1.45;\">{{ quizQ }}<\u002Fp>\n                          <div style=\"display:grid;gap:7px;\">\n                            <sc-for list=\"{{ quizOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                              <button sc-camel-on-click=\"{{ o.onPick }}\" style=\"text-align:left;border:1.5px solid {{ o.border }};background:{{ o.bg }};color:var(--ink);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .15s;\" style-hover=\"border-color:var(--accent)\">\n                                <span style=\"width:18px;height:18px;flex:0 0 18px;border-radius:6px;border:1.5px solid {{ o.dotBorder }};background:{{ o.dotBg }};display:grid;place-items:center;color:#fff;\">\n                                  <sc-if value=\"{{ o.showMark }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 12.5l5 5 10-11\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                                <\u002Fspan>{{ o.t }}\n                              <\u002Fbutton>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ quizFeedbackOn }}\" hint-placeholder-val=\"{{ false }}\">\n                            <p style=\"margin:10px 0 0;font-size:12.5px;font-weight:600;color:{{ quizFeedbackC }};\">{{ quizFeedback }}<\u002Fp>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ typing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:inline-flex;gap:4px;padding:12px 14px;background:var(--panel2);border-radius:13px 13px 13px 4px;width:max-content;\">\n                      <span style=\"width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blinkDot 1.2s infinite;\"><\u002Fspan><span style=\"width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blinkDot 1.2s .2s infinite;\"><\u002Fspan><span style=\"width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blinkDot 1.2s .4s infinite;\"><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"padding:10px 12px 12px;border-top:1px solid var(--line);\">\n                  <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;\">\n                    <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ c.onSend }}\" style=\"border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;\" style-hover=\"border-color:var(--accent);color:var(--accent);background:var(--accent-soft)\">{{ c.t }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:13px;padding:5px 5px 5px 13px;background:var(--bg);\">\n                    <input value=\"{{ chatInput }}\" sc-camel-on-change=\"{{ onChatInput }}\" sc-camel-on-key-down=\"{{ onChatKey }}\" placeholder=\"Ask about this note…\" style=\"flex:1;border:none;outline:none;background:transparent;font-size:13.5px;min-width:0;\">\n                    <button sc-camel-on-click=\"{{ sendChat }}\" style=\"width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:0 0 34px;transition:transform .15s;\" style-hover=\"transform:scale(1.06)\" style-active=\"transform:scale(.95)\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 11.5 20 4l-4.5 16-4-6.5z\"><\u002Fpath><path d=\"M20 4l-8.5 9.5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Faside>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <!-- ================= QUICK ANSWER ================= -->\n    <sc-if value=\"{{ isAsk }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Quick answer\" style=\"max-width:780px;margin:0 auto;padding:30px 40px 40px;display:flex;flex-direction:column;min-height:calc(100vh - 46px);\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px;\">\n          <button sc-camel-on-click=\"{{ goHome }}\" title=\"Back\" style=\"width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center;\" style-hover=\"border-color:var(--accent);color:var(--accent)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <h1 style=\"margin:0;font-family:'Schibsted Grotesk',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em;\">Quick answer<\u002Fh1>\n          <span style=\"font-size:11.5px;font-weight:600;color:var(--mut);border:1px dashed var(--line);border-radius:999px;padding:4px 10px;\">not saved<\u002Fspan>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ askAnother }}\" style=\"height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;\" style-hover=\"border-color:var(--accent);color:var(--accent)\">New question<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ saveAsNote }}\" style=\"height:34px;padding:0 15px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:opacity .15s;\" style-hover=\"opacity:.87\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5\"><\u002Fpath><\u002Fsvg>Save as note<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:12.5px;color:var(--mut);\">A lightweight chat — nothing is stored unless you save it as a note.<\u002Fp>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:14px;\">\n          <sc-for list=\"{{ askMsgs }}\" as=\"m\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;flex-direction:column;align-items:{{ m.align }};animation:popIn .2s ease both;\">\n              <div style=\"max-width:82%;font-size:14.5px;line-height:1.6;padding:12px 13px;font-style:italic;color:var(--ink);margin-bottom:16px;\">“{{ schedQuote }}”<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;\">\n          <sc-for list=\"{{ schedTimes }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ t.onPick }}\" style=\"border:1.5px solid {{ t.border }};background:{{ t.bg }};color:{{ t.color }};border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;\" style-hover=\"border-color:var(--accent)\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);\">Push preview<\u002Fp>\n        <div style=\"background:linear-gradient(135deg,#1d1d24,#2a2a35);border-radius:16px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);\">\n          <span style=\"width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"white\"><path d=\"M12 2.5l2.4 6.1 6.1 2.4-6.1 2.4L12 19.5 9.6 13.4 3.5 11l6.1-2.4z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div style=\"min-width:0;color:#F2F1EE;\">\n            <div style=\"display:flex;gap:8px;align-items:baseline;\"><strong style=\"font-size:13px;\">Quiz time<\u002Fstrong><span style=\"font-size:11px;color:rgba(255,255,255,.5);\">{{ schedLabelShort }}<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.75);line-height:1.45;\">Вторжение США в Ирак — 5 questions on your highlight. ~2 min.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;\">\n          <button sc-camel-on-click=\"{{ closeSched }}\" style=\"flex:1;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;\" style-hover=\"background:var(--panel2)\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ confirmSched }}\" style=\"flex:2;height:42px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -8px var(--accent);transition:transform .15s;\" style-hover=\"transform:translateY(-1px)\" style-active=\"transform:scale(.98)\">Schedule quiz<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toast -->\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:26px;z-index:90;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 14px 34px -10px rgba(0,0,0,.4);animation:toastIn .25s ease both;\">\n      <span style=\"width:20px;height:20px;border-radius:7px;background:var(--ok);display:grid;place-items:center;color:#fff;\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 12.5l5 5 10-11\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      {{ toast }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:[&quot;#F72585&quot;,&quot;#FF8E3C&quot;],&quot;options&quot;:[[&quot;#F72585&quot;,&quot;#FF8E3C&quot;],[&quot;#7C3AED&quot;,&quot;#22D3EE&quot;],[&quot;#0E9F6E&quot;,&quot;#84CC16&quot;],[&quot;#111114&quot;,&quot;#F72585&quot;]],&quot;tsType&quot;:&quot;string | string[]&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;paper&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;cream&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;darkStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;landing&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;mascot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Brand&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Comfort&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    theme: 'light', screen: 'home', showOnboard: true,\n    composer: '', focusC: false, attach: [], recording: false,\n    creating: null, // {pct, stage, done}\n    tab: 'overview', chatOpen: false, chatInput: '', typing: false,\n    msgs: [{ id: 1, role: 'ai', kind: 'text', text: 'Привет! Я прочитал всю заметку — спрашивай что угодно, или выдели текст слева, чтобы начать с конкретного места.' }],\n    quizPicked: null, selPop: null, schedOpen: false, schedPick: 0,\n    schedQuote: 'Но за бурными аплодисментами никто не услышал, что в самом Ираке уже началась другая война.',\n    toast: null, retitleOpen: false, hintPulse: false,\n    saleOpen: true, saleLeft: 17 * 86400 + 16 * 3600 + 26 * 60 + 59,\n    askMsgs: [], askInput: '', intentOverride: 'auto', chatWide: false,\n    title: 'Вторжение США в Ирак 2003 года',\n  };\n  stages = ['Uploading files', 'Transcribing audio', 'Summarizing & structuring', 'Generating quiz & flashcards'];\n  fun = [\n    'Sending your files up — hold tight…',\n    'Listening closely… every word makes better quiz questions.',\n    'Finding the structure: key events, people, causes.',\n    'Almost there — writing questions you\\u2019ll actually enjoy.',\n  ];\n  quizData = { q: 'В каком году появилась программа «Нефть в обмен на продовольствие»?', opts: ['1991 год', '1996 год', '1997 год', '2001 год'], correct: 1 };\n\n  componentDidMount() {\n    this.applyPrefs();\n    this._mu = (e) => this.onMouseUp(e);\n    document.addEventListener('mouseup', this._mu);\n    this._sc = setInterval(() => this.state.saleOpen && this.setState(s => ({ saleLeft: Math.max(0, s.saleLeft - 1) })), 1000);\n  }\n  componentDidUpdate() { this.applyPrefs(); }\n  componentWillUnmount() {\n    document.removeEventListener('mouseup', this._mu);\n    clearInterval(this._ct); clearInterval(this._sc); clearTimeout(this._tt); clearTimeout(this._ht); clearTimeout(this._rt);\n  }\n  applyPrefs() {\n    const el = document.documentElement;\n    el.setAttribute('data-theme', this.state.theme);\n    el.setAttribute('data-motion', (this.props.reduceMotion ?? false) ? 'off' : 'on');\n    el.setAttribute('data-paper', this.props.paper ?? 'neutral');\n    el.setAttribute('data-dark-style', this.props.darkStyle ?? 'neutral');\n    const a = this.props.accent;\n    const pair = Array.isArray(a) ? a : (a ? [a, '#FF8E3C'] : null);\n    if (pair) { el.style.setProperty('--accent', pair[0]); el.style.setProperty('--accent2', pair[1] || pair[0]); }\n  }\n  onMouseUp(e) {\n    if (e.target && e.target.closest && e.target.closest('[data-selpop]')) return;\n    setTimeout(() => {\n      const sel = window.getSelection();\n      const el = this.contentEl;\n      if (!el || !sel || sel.isCollapsed || !sel.rangeCount) { if (this.state.selPop) this.setState({ selPop: null }); return; }\n      const node = sel.anchorNode;\n      if (!el.contains(node)) { if (this.state.selPop) this.setState({ selPop: null }); return; }\n      const r = sel.getRangeAt(0).getBoundingClientRect();\n      const c = el.getBoundingClientRect();\n      const text = sel.toString().trim().slice(0, 140);\n      if (!text) return;\n      this.setState({ selPop: { left: Math.max(130, Math.min(c.width - 130, r.left - c.left + r.width / 2)), top: Math.max(8, r.top - c.top - 52), text } });\n    }, 10);\n  }\n  detectIntent() {\n    const s = this.state, t = s.composer.trim();\n    if (s.intentOverride !== 'auto') return s.intentOverride;\n    if (s.attach.length) return 'note';\n    if (!t) return 'note';\n    if (t.length < 180 && /(\\?|почему|как |что |когда |зачем|объясни|why |how |what |when |explain )/i.test(t)) return 'ask';\n    return 'note';\n  }\n  submitComposer() {\n    const intent = this.detectIntent();\n    const t = this.state.composer.trim();\n    if (intent === 'ask') {\n      this.setState({ screen: 'ask', composer: '', intentOverride: 'auto' });\n      this.sendAsk(t || 'Почему США вторглись в Ирак в 2003 году?');\n    } else {\n      if (t && this.state.attach.length && /(\\?|почему|как |зачем|why |how |what )/i.test(t)) this._pendingQ = t;\n      this.startCreating();\n    }\n  }\n  sendAsk(text) {\n    if (!text) return;\n    this.setState(st => ({ askMsgs: [...st.askMsgs, { id: Date.now(), role: 'user', kind: 'text', text }], askInput: '', typing: true }));\n    this._rt = setTimeout(() => {\n      const reply = /нефть|food|1996/i.test(text)\n        ? 'Программа «Нефть в обмен на продовольствие» появилась в 1996 году (резолюция ООН №986): Ираку разрешили продавать нефть под контролем ООН, а выручка шла на еду и лекарства. Если пригодится — нажми «Save as note», и я оформлю это в полноценную заметку с квизом.'\n        : 'Коротко: официальным поводом было ОМП, которое так и не нашли. Реальная картина сложнее — санкции 90-х, шаткость режима после 1991-го и ставка на «смену режима». Хочешь, разберу по шагам — или сохрани это как заметку, и я сделаю из ответа конспект с квизом.';\n      this.setState(st => ({ typing: false, askMsgs: [...st.askMsgs, { id: Date.now() + 1, role: 'ai', kind: 'text', text: reply }] }));\n    }, 1200);\n  }\n  startCreating() {\n    clearInterval(this._ct);\n    this.setState({ creating: { pct: 0, stage: 0, done: false }, composer: '', attach: [], recording: false });\n    this._ct = setInterval(() => {\n      const c = this.state.creating; if (!c || c.done) return clearInterval(this._ct);\n      let pct = c.pct + 1 + Math.random() * 2.4;\n      let stage = pct < 18 ? 0 : pct < 52 ? 1 : pct < 84 ? 2 : 3;\n      if (pct >= 100) {\n        clearInterval(this._ct);\n        this.setState({ creating: { pct: 100, stage: 3, done: true } });\n        if (this._pendingQ) {\n          const q = this._pendingQ; this._pendingQ = null;\n          this.setState(st => ({ chatOpen: true, msgs: [...st.msgs, { id: Date.now(), role: 'user', kind: 'text', text: q }] }));\n          this.pushAi({ id: Date.now() + 1, role: 'ai', kind: 'text', text: 'Заметка готова — и вот ответ на твой вопрос: официальным поводом было ОМП, но доказательств не нашли; подробности — в разделе «Информационная кампания» твоей заметки.' }, 1400);\n          this.showToast('Note ready — your question is answered in chat');\n        } else this.showToast('Note is ready — quiz and flashcards included');\n      } else this.setState({ creating: { pct, stage, done: false } });\n    }, 90);\n  }\n  showToast(t) { clearTimeout(this._tt); this.setState({ toast: t }); this._tt = setTimeout(() => this.setState({ toast: null }), 3800); }\n  pushAi(msg, delay) {\n    this.setState({ typing: true });\n    this._rt = setTimeout(() => {\n      this.setState(s => ({ typing: false, msgs: [...s.msgs, msg] }), () => this.scrollChat());\n    }, delay || 1100);\n  }\n  scrollChat() { if (this.chatEl) this.chatEl.scrollTop = this.chatEl.scrollHeight; }\n  send(text, quote) {\n    if (!text) return;\n    this.setState(s => ({ chatOpen: true, chatInput: '', msgs: [...s.msgs, { id: Date.now(), role: 'user', kind: 'text', text, quote }] }), () => this.scrollChat());\n    const reply = /нефть|food|1996/i.test(text + (quote || ''))\n      ? 'Программа «Нефть в обмен на продовольствие» была создана в 1996 году: Ираку разрешили продавать нефть, но выручка шла под контролем ООН на еду и лекарства. Хочешь, добавлю это в карточки?'\n      : 'Коротко: заявленный повод (ОМП) не подтвердился, а ошибки оккупации — роспуск армии и запрет партии Баас — превратили быструю победу в затяжную войну. Могу разобрать любую часть глубже.';\n    this.pushAi({ id: Date.now() + 1, role: 'ai', kind: 'text', text: reply });\n  }\n  makeQuiz(quote) {\n    this.setState(s => ({ chatOpen: true, quizPicked: null, msgs: [...s.msgs, { id: Date.now(), role: 'ai', kind: 'quiz' }] }), () => this.scrollChat());\n  }\n  renderVals() {\n    const s = this.state, P = this.props;\n    const cr = s.creating;\n    const hour = new Date().getHours();\n    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';\n    const isNote = s.screen === 'note';\n    const noteProcessing = isNote && cr && !cr.done;\n    const times = ['Tonight · 20:00', 'Tomorrow · 09:00', 'In 3 days', 'Every Sunday'];\n    const qd = this.quizData;\n    const intent = this.detectIntent();\n    const notes = [\n      { title: s.title, folder: 'live', meta: '12 min audio · 1 PDF · quiz ready', date: 'Aug 30', score: 'Quiz 4/5', tint: 'linear-gradient(135deg,var(--accent),var(--accent2))', scoreC: 'var(--ok)', scoreBg: 'rgba(18,183,106,.1)' },\n      { title: 'Квантовая запутанность — просто о сложном', folder: 'Physics', meta: 'YouTube · 18 min', date: 'Aug 27', score: 'Quiz 5/5', tint: 'linear-gradient(135deg,#7C3AED,#4F46E5)', scoreC: 'var(--ok)', scoreBg: 'rgba(18,183,106,.1)' },\n      { title: 'Клеточное дыхание: гликолиз и цикл Кребса', folder: 'Common', meta: 'Lecture audio · 43 min', date: 'Aug 24', score: 'New quiz ready', tint: 'linear-gradient(135deg,#0EA5E9,#22D3EE)', scoreC: 'var(--accent)', scoreBg: 'var(--accent-soft)' },\n    ].map(n => ({ ...n, onOpen: () => this.setState({ screen: 'note', tab: 'overview' }) }));\n    const msgs = s.msgs.map(m => {\n      const user = m.role === 'user';\n      return {\n        ...m, isText: m.kind === 'text', isQuiz: m.kind === 'quiz', hasQuote: !!m.quote,\n        align: user ? 'flex-end' : 'flex-start',\n        bg: user ? 'linear-gradient(135deg,var(--accent),var(--accent2))' : 'var(--panel2)',\n        color: user ? '#fff' : 'var(--ink)',\n        border: 'none',\n        radius: user ? '13px 13px 4px 13px' : '13px 13px 13px 4px',\n      };\n    });\n    const quizOpts = qd.opts.map((t, i) => {\n      const picked = s.quizPicked, isC = i === qd.correct, isP = picked === i;\n      let border = 'var(--line)', bg = 'var(--panel)', dotBorder = 'var(--line)', dotBg = 'transparent', showMark = false;\n      if (picked != null) {\n        if (isC) { border = 'var(--ok)'; bg = 'rgba(18,183,106,.08)'; dotBorder = 'var(--ok)'; dotBg = 'var(--ok)'; showMark = true; }\n        else if (isP) { border = 'var(--bad)'; bg = 'rgba(229,72,77,.07)'; dotBorder = 'var(--bad)'; }\n      }\n      return { t, border, bg, dotBorder, dotBg, showMark, onPick: () => s.quizPicked == null && this.setState({ quizPicked: i }, () => this.scrollChat()) };\n    });\n    const steps = this.stages.map((label, i) => {\n      const done = cr ? (cr.stage > i || cr.done) : false;\n      const active = cr ? (cr.stage === i && !cr.done) : false;\n      return {\n        label, num: i + 1, done, notDone: !done, active,\n        border: active ? 'var(--accent)' : 'var(--line)',\n        bg: active ? 'var(--accent-soft)' : done ? 'var(--bg)' : 'var(--panel)',\n        iconBg: done ? 'var(--ok)' : active ? 'var(--accent)' : 'var(--panel2)',\n        iconC: done || active ? '#fff' : 'var(--mut)',\n        textC: done || active ? 'var(--ink)' : 'var(--mut)',\n      };\n    });\n    return {\n      greeting, isHome: s.screen === 'home', isNote,\n      isDark: s.theme === 'dark', isLight: s.theme === 'light',\n      mascotOn: P.mascot ?? true,\n      toggleTheme: () => this.setState({ theme: s.theme === 'dark' ? 'light'
